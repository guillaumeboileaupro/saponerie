name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatage, lint et tests d'abord (ARCHITECTURE.md : "CI séparant
  # formatage, lint, tests, build Linux et build Windows"). Les jobs de
  # build ne démarrent que si cette étape passe.
  quality:
    name: Formatage, lint et tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances système Linux (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Vérification TypeScript stricte et build frontend
        run: npm run build

      - name: Tests unitaires frontend (vitest)
        run: npm run test:unit

      - name: Vérification TypeScript des tests Playwright
        run: npm run typecheck:e2e

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (Playwright, IPC Tauri simulé)
        run: npm run test:e2e

      - name: Publier le rapport Playwright (captures et traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Build et empaquetage réels sur chaque plateforme cible (§9 de
  # docs/PROJECT_CONTEXT.md : .deb Ubuntu, installateur Windows). Le
  # runner Windows ne remplace jamais un test réel sous Windows, mais
  # c'est la seule vérification automatisée disponible ici.
  build:
    name: Build (${{ matrix.platform }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances système Linux (Tauri)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ADR 0005 : uniquement .deb sur Linux et NSIS sur Windows. Sans
      # --bundles explicite, tauri-action construit tous les formats
      # disponibles sur la plateforme (appimage/rpm en plus du deb,
      # msi en plus du nsis), en ignorant la restriction "targets" de
      # tauri.conf.json.
      - name: Build Tauri (.deb sur Linux, NSIS sur Windows — ADR 0005)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.platform == 'linux' && 'deb' || 'nsis' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Le workspace Cargo a sa racine au niveau du dépôt : le dossier
      # cible est <racine>/target, pas src-tauri/target.
      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: la-saponnerie-${{ matrix.platform }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
