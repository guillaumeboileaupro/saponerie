<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">La Saponnerie — variante lumineuse</title>
  <desc id="desc">Un savon bleu avec une vague et une bulle, entouré d’une lueur discrète.</desc>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#135C91" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="176" y="330" width="672" height="410" rx="145"/>
    <path d="M330 550c105-95 210 105 365 0"/>
    <circle cx="785" cy="235" r="56" fill="#135C91" stroke="none"/>
  </g>
</svg>
