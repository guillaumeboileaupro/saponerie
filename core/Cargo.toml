[package]
name = "saponerie-core"
version = "0.1.0"
edition = "2021"
description = "Moteur de calcul pur de La Saponnerie (NaOH, surgras, pureté, eau)."
license = "GPL-3.0-or-later"

[dependencies]
rust_decimal = { version = "1", features = ["serde-str"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
